<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="theme-color" content="#050404"><title>Sign In | Velora Jewells</title><style>
*{box-sizing:border-box}body{margin:0;min-height:100vh;background:#050404;color:#f0e4d3;font-family:Georgia,'Times New Roman',serif;display:grid;place-items:center;padding:22px;background-image:radial-gradient(ellipse at 80% 15%,#39201666,transparent 35%),radial-gradient(ellipse at 10% 90%,#2a101766,transparent 35%)}a{color:#d4b17c}.card{width:min(100%,440px);border:1px solid #806342;background:#080706eF;padding:30px;box-shadow:0 24px 90px #000b;position:relative}.brand{font-size:12px;letter-spacing:7px;color:#d9c29c;text-align:center;margin:0 0 28px}.eyebrow{text-align:center;font:10px Arial,sans-serif;letter-spacing:3px;color:#c4a16e}.title{text-align:center;font-size:42px;font-weight:400;line-height:1;margin:14px 0}.desc{text-align:center;color:#bcae9c;font:13px/1.6 Arial,sans-serif;margin:0 auto 25px;max-width:310px}label{display:block;font:10px Arial,sans-serif;letter-spacing:1.4px;color:#cbb28c;margin:14px 0 7px;text-transform:uppercase}input{width:100%;background:#0c0a09;color:#f3e8d9;border:1px solid #49372a;padding:13px;font:14px Arial,sans-serif;outline:none}input:focus{border-color:#c6a578}button{width:100%;margin-top:18px;padding:13px;border:1px solid #b99a6b;background:#c6a578;color:#100b07;font:bold 10px Arial,sans-serif;letter-spacing:2px;text-transform:uppercase;cursor:pointer}button:disabled{opacity:.55;cursor:wait}.message{min-height:20px;color:#d9bd8e;font:12px/1.6 Arial,sans-serif;margin-top:12px;white-space:pre-wrap}.switch{text-align:center;color:#bcae9c;font:12px Arial,sans-serif;margin:20px 0 0}.back{text-align:center;font:12px Arial,sans-serif;margin-top:20px}.divider{border:0;border-top:1px solid #38291f;margin:22px 0}@media(max-width:420px){.card{padding:24px 19px}.title{font-size:36px}}
</style></head><body><main class="card"><div class="brand">VELORA JEWELLS</div><div class="eyebrow">A DARKER KIND OF LUXURY</div><h1 class="title">Welcome Back</h1><p class="desc">Sign in to your Velora account to access your profile and order history.</p>
<form id="authForm"><label for="email">Email address</label><input id="email" name="email" type="email" autocomplete="email" required placeholder="you@example.com"><label for="password">Password</label><input id="password" name="password" type="password" minlength="6" autocomplete="current-password" required placeholder="At least 6 characters"><button id="submit" type="submit">Sign In</button></form><button id="googleBtn" type="button" style="background:transparent;color:#e8d5bd;border-color:#806342">Continue with Google</button><div id="message" class="message" role="status"></div><hr class="divider"><div class="switch">New to Velora? <a href="register.html">Create an account</a></div><div class="back"><a href="index.html">← Back to store</a></div></main>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.57.0/dist/umd/supabase.min.js"></script><script>
const db=window.supabase.createClient('https://arypnpohredubfaymuwm.supabase.co','sb_publishable_aJZyDdFiMkOuhmIxEKIuuA_QALzapmi');
document.getElementById('googleBtn').addEventListener('click',async()=>{const btn=document.getElementById('googleBtn'),msg=document.getElementById('message');btn.disabled=true;msg.textContent='Connecting to Google…';try{const {error}=await db.auth.signInWithOAuth({provider:'google',options:{redirectTo:window.location.origin+'/index.html?account=profile'}});if(error)throw error}catch(err){msg.textContent=err.message||'Google sign-in could not start.';btn.disabled=false}});
document.getElementById('authForm').addEventListener('submit',async e=>{e.preventDefault();const btn=document.getElementById('submit'),msg=document.getElementById('message');btn.disabled=true;msg.textContent='Please wait…';try{const email=document.getElementById('email').value.trim(),password=document.getElementById('password').value;const {data,error}=await db.auth.signInWithPassword({email,password});if(error)throw error;msg.textContent='Signed in successfully. Opening your profile…';window.location.href='index.html?account=profile' }catch(err){msg.textContent=err.message||'Something went wrong. Please try again.'}finally{btn.disabled=false}});
</script></body></html>
