name: Deploy Velora Jewells to GitHub Pages

on:
  push:
    branches: ["main"]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: "pages"
  cancel-in-progress: true

jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pages: write
      id-token: write
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Assemble high-quality hero image
        shell: bash
        run: |
          set -euo pipefail
          if [ -d ".github/hero-source" ]; then
            count="$(find .github/hero-source -maxdepth 1 -type f -name 'part-*.txt' | wc -l)"
            if [ "$count" -eq 12 ]; then
              cat .github/hero-source/part-*.txt | base64 --decode > assets/velora-gothic-queen-hires.avif
              test -s assets/velora-gothic-queen-hires.avif
              echo "Built high-quality hero image ($(wc -c < assets/velora-gothic-queen-hires.avif) bytes)."
              rm -rf .github/hero-source
            fi
          fi
      - name: Configure Pages
        uses: actions/configure-pages@v5
      - name: Upload static site
        uses: actions/upload-pages-artifact@v4
        with:
          path: .
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
