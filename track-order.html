<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="theme-color" content="#050405"><meta name="description" content="Track your Velora Jewells order securely."><link rel="icon" href="favicon.svg" type="image/svg+xml"><title>Track Your Order — Velora Jewells</title><link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:wght@500;600&family=DM+Sans:wght@400;500;600&display=swap" rel="stylesheet"><style>
:root{--bg:#050405;--panel:#100c0e;--line:#47302d;--text:#f5eee7;--muted:#b6a6a0;--gold:#c7a477}*{box-sizing:border-box}body{margin:0;background:radial-gradient(ellipse at 50% -10%,#28131a,transparent 50%),var(--bg);color:var(--text);font-family:'DM Sans',sans-serif;min-height:100vh}a{color:var(--gold);text-decoration:none}.top{padding:22px 6%;border-bottom:1px solid var(--line);display:flex;justify-content:space-between;align-items:center}.brand{font:600 25px 'Cormorant Garamond',serif;letter-spacing:5px;color:#e5d1b2}.brand span{color:var(--gold)}.wrap{max-width:760px;margin:0 auto;padding:70px 20px}.eyebrow{font-size:10px;letter-spacing:3px;color:var(--gold);text-transform:uppercase}.panel{margin-top:20px;padding:30px;border:1px solid var(--line);background:linear-gradient(150deg,#171013,#090708)}h1{font:500 clamp(40px,7vw,64px)/1 'Cormorant Garamond',serif;margin:12px 0}p{color:var(--muted);font-size:13px;line-height:1.8}label{display:block;color:#c8b7ae;font-size:11px;margin:18px 0 7px}input{width:100%;padding:14px;background:#070506;border:1px solid #594032;color:white;outline:none}input:focus{border-color:var(--gold)}button{width:100%;margin-top:20px;padding:14px;background:linear-gradient(135deg,#d5b58b,#9e794e);border:1px solid #d5b58b;color:#10090a;font-size:11px;font-weight:700;letter-spacing:1.4px;text-transform:uppercase;cursor:pointer}button:disabled{opacity:.6;cursor:wait}.msg{display:none;padding:13px;margin-top:18px;font-size:12px;line-height:1.7;border:1px solid var(--line);color:#e7d8c8}.msg.show{display:block}.msg.bad{border-color:#8b394b;color:#ffd0d9}.result{display:none;margin-top:22px;padding:24px;border:1px solid #72563e;background:#0c090a}.result.show{display:block}.result h2{font:500 30px 'Cormorant Garamond',serif;margin:0 0 15px}.status{display:inline-block;padding:7px 10px;border:1px solid #806448;color:#e4c89e;font-size:10px;letter-spacing:1px;text-transform:uppercase}.rows{display:grid;grid-template-columns:1fr 1fr;gap:14px;margin-top:18px}.rows div{border-top:1px solid var(--line);padding-top:10px}.rows small{display:block;color:var(--muted);font-size:10px;text-transform:uppercase;letter-spacing:1px}.rows strong{display:block;margin-top:6px;font-size:13px;overflow-wrap:anywhere}.tracklink{display:inline-block;margin-top:20px;border-bottom:1px solid var(--gold);padding-bottom:4px;font-size:12px}@media(max-width:520px){.wrap{padding:45px 16px}.panel{padding:20px}.rows{grid-template-columns:1fr 1fr}}
</style></head><body><header class="top"><a class="brand" href="index.html">VELORA <span>JEWELLS</span></a><a href="index.html">← Back to store</a></header><main class="wrap"><span class="eyebrow">Your order, in focus</span><h1>Track your order.</h1><p>Enter the Velora order number from your confirmation and the mobile number used at checkout. We only show tracking details after both match.</p><section class="panel"><form id="trackForm"><label for="orderNumber">Order number</label><input id="orderNumber" placeholder="VJ-XXXXXXXXXX" maxlength="13" autocomplete="off" required><label for="phone">Checkout mobile number</label><input id="phone" type="tel" inputmode="numeric" placeholder="10-digit mobile number" maxlength="10" required><button id="trackBtn" type="submit">Find my order</button></form><div id="message" class="msg" role="status"></div><div id="result" class="result"></div></section></main><script>
const SUPABASE_URL='https://arypnpohredubfaymuwm.supabase.co',SUPABASE_KEY='sb_publishable_aJZyDdFiMkOuhmIxEKIuuA_QALzapmi';
const form=document.getElementById('trackForm'),message=document.getElementById('message'),result=document.getElementById('result'),button=document.getElementById('trackBtn');
const esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const pretty=s=>String(s||'Pending').replaceAll('_',' ').replace(/\b\w/g,c=>c.toUpperCase());
form.addEventListener('submit',async e=>{e.preventDefault();message.className='msg';result.className='result';button.disabled=true;button.textContent='Checking…';try{const response=await fetch(SUPABASE_URL+'/functions/v1/track-order',{method:'POST',headers:{'Content-Type':'application/json','apikey':SUPABASE_KEY,'Authorization':'Bearer '+SUPABASE_KEY},body:JSON.stringify({order_number:document.getElementById('orderNumber').value.trim().toUpperCase(),phone:document.getElementById('phone').value.trim()})});const data=await response.json().catch(()=>({}));if(!response.ok)throw new Error(data.error||'Could not find this order.');const o=data.order;const date=o.created_at?new Date(o.created_at).toLocaleDateString('en-IN',{day:'numeric',month:'short',year:'numeric'}):'—';const orderLabel=o.payment_method==='cod'&&o.payment_status!=='paid'?(o.upi_reference?'Pending payment verification':'Awaiting ₹70 COD advance') : pretty(o.order_status);const paymentLabel=o.payment_method==='cod'&&o.upi_reference&&o.payment_status!=='paid'?'UTR submitted · Awaiting Velora approval':pretty(o.payment_status)+' · '+pretty(o.payment_method);result.innerHTML='<h2>Order '+esc(o.order_number)+'</h2><span class="status">'+esc(orderLabel)+'</span><div class="rows"><div><small>Order placed</small><strong>'+esc(date)+'</strong></div><div><small>Payment</small><strong>'+esc(paymentLabel)+'</strong></div><div><small>Courier</small><strong>'+esc(o.tracking_company||'Not assigned yet')+'</strong></div><div><small>Tracking / AWB</small><strong>'+esc(o.tracking_number||'Awaiting dispatch')+'</strong></div></div>'+(o.tracking_url?'<a class="tracklink" href="'+esc(o.tracking_url)+'" target="_blank" rel="noopener noreferrer">Track with courier ↗</a>':'');result.classList.add('show')}catch(err){message.textContent=err.message||'Something went wrong.';message.classList.add('show','bad')}finally{button.disabled=false;button.textContent='Find my order'}});
</script></body></html>
